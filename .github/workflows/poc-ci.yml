name: Voice PoC CI

on:
  push:
    paths:
      - "poc/**"
      - ".github/workflows/poc-ci.yml"
  pull_request:
    paths:
      - "poc/**"
      - ".github/workflows/poc-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q server
      - name: Check browser modules
        run: |
          node --check web/call.js
          node --check web/audio-worklet.js
          node --check web/playback-queue.js
          node --check web/protocol.js
